<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Decision Tree</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Load default data files -->
    <script src="dinner_decision_data.js"></script>
    <script src="hiking_decision_data.js"></script>
</head>

<body>

    <div id="control-panel">
        <div id="current-path"></div>
        <div class="control-group">
            <label for="edit-mode-toggle">Edit Mode</label>
            <input type="checkbox" id="edit-mode-toggle">
        </div>
        <div id="edit-controls">
            <input type="text" id="save-filename" placeholder="filename.js" value="my-tree.js">
            <div class="control-group">
                <button id="save-btn">💾 Save Tree</button>
                <button id="new-tree-btn">✨ New Tree</button>
            </div>
        </div>
        <div style="margin-top: 10px;">
            <input type="file" id="data-file-input" accept=".js">
        </div>
    </div>

    <div id="tree-container"></div>

    <div id="context-menu">
        <ul>
            <li id="menu-add-child">➕ Add Child</li>
            <li id="menu-edit-node">✏️ Edit Text</li>
            <li id="menu-generate-ai">🤖 Generate Children (AI)</li>
            <li id="menu-delete-node">🗑️ Delete Node</li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
