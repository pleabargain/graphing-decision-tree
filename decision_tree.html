<!-- https://github.com/pleabargain/graphing-decision-tree/tree/interactive -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Decision Tree</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Load default data files -->
    <script src="dinner_decision_data.js"></script>
    <script src="hiking_decision_data.js"></script>
</head>

<body>

    <div id="tree-title">
        <div id="title-text"></div>
        <div id="title-controls">
            <div class="control-group">
                <label for="edit-mode-toggle">Edit Mode</label>
                <input type="checkbox" id="edit-mode-toggle">
            </div>
            <div id="edit-controls">
                <input type="text" id="save-filename" placeholder="filename.js" value="my-tree.js">
                <div class="control-group">
                    <button id="save-btn">💾 Save Tree</button>
                    <button id="new-tree-btn">✨ New Tree</button>
                </div>
            </div>
        </div>
    </div>

    <div id="control-panel">
        <div id="current-path"></div>
        <div style="margin-top: 10px;">
            <input type="file" id="data-file-input" accept=".js">
        </div>
        <div style="margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px;">
            <label for="search-input" style="font-size: 0.9em; font-weight: bold; display: block; margin-bottom: 5px;">🔍 Search Files</label>
            <input type="text" id="search-input" placeholder="Search .js files...">
            <div id="search-results" style="display: none; margin-top: 5px; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; background: white;"></div>
        </div>
    </div>

    <div id="tree-container"></div>

    <div id="context-menu">
        <ul>
            <li id="menu-add-child">➕ Add Child</li>
            <li id="menu-edit-node">✏️ Edit Text</li>
            <li id="menu-generate-ai">🤖 Generate Children (AI)</li>
            <li id="menu-delete-node">🗑️ Delete Node</li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
